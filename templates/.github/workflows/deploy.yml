name: Deploy to GitHub Pages

on:
{{#if deployOnRelease}}
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [{{defaultBranch}}]
{{/if}}
{{#if deployOnPush}}
  push:
    branches: [{{defaultBranch}}]
{{/if}}
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
{{#if deployOnRelease}}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
{{/if}}
    runs-on: ubuntu-latest
    steps:
{{#if deployOnRelease}}
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.repository.default_branch }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
{{else}}
      - name: Checkout
        uses: actions/checkout@v4
{{/if}}
{{#if hasBuild}}

      - name: Build
        run: |
{{buildRunIndented}}
{{/if}}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: {{deployArtifact}}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
